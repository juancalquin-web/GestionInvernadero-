<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="vieport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/dashboard.css">
        <link rel="stylesheet" href="CSS/gobal.css">
        <title>Inicio - Dashboard</title>
    </head>
    <body>
    <header class="navbar">
        <!--Encabezado para las páginas-->
        <a href="dashboard.html" class="logo">"Logo aquí" Gestión Invernaderos</a>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-button active">Inicio</a>
            <a href="invernadero.html" class="nav-button">Invernadero</a>
            <a href="agregar.html" class="nav-button">Agregar</a>
            <a href="estadisticas.html" class="nav-button">Estadísticas</a>
            <a href="login.html" class="nav-button button-logout">Cerrar Sesión</a>
        </nav>
    </header>
    <!--Este header va en todas las vistas de usuario, excepto admin y login-->
    <main class="main-container">
        <h2>Resumen del Invernadero</h2>

        <div class="dashboard-grid">
            <div class="card metric-card">
                <h3>Cultivos Registrados</h3>
                <p class="metric-value">3</p>
            </div>

            <div class="card metric-card">
                <h3>Sensores Activos</h3>
                <p class="metric-value">4</p>
            </div>

            <div class="card metric-card">
                <h3>Datos recolectados</h3>
                <p class="metric-value">1209</p>
            </div>
        </div>

        <!--Tarjeta de Navegación rápida para que no quede tan vacío-->
        <div class="card">
            <h3>Navegación Rápida</h3>
            <div class="quick-actions">
                <a href="agregar.html" class="button button-primario" style="text-decoration: none; width: auto;">+ Agregar Recursos</a>
                <a href="invernadero.html" class="button button-secundario" style="text-decoration: none; width: auto;">Ver Invernadero</a>
                <a href="estadisticas.html" class="button button-secundario" style="text-decoration: none; width: auto;">Ver Datos de Lecturas</a>
            </div>
        </div>
    </main>
</body>
</html>
