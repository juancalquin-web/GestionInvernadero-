<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../CSS/global.css">
  <link rel="stylesheet" href="../../CSS/admin.css">
  <title>Usuarios - Panel Admin</title>
  <script defer src="../../JS/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<header class="navbar">
    <a href="admin.html" class="logo logo-admin">&#x1FAB4; &#x1F6E1;&#xFE0F; Gestión Invernaderos</a>
  <nav class="navbar-navigation" aria-label="Navegación principal">
    <input type="checkbox" id="menu-toggle" class="menu-toggle"><label for="menu-toggle" class="menu-toggle-label">&#x2630; Menú</label>
    <div class="nav-links">
      <a href="admin.html" class="nav-button">Inicio Administrador</a>
      <a href="admin-usuarios.html" class="nav-button active">Usuarios</a>
      <a href="admin-invernaderos.html" class="nav-button">Invernaderos</a>
      <a href="../login.html" class="nav-button button-logout">Cerrar Sesión</a>
    </div>
  </nav>
</header>
<main class="main-container" x-data>
  <h1>Gestión de usuarios</h1>
  <section class="card admin-table-container">
    <div class="admin-header-actions">
      <h2>&#x1F465; Usuarios del sistema</h2>
      <button type="button" class="button button-primario" id="btn-mostrar-usuario" aria-expanded="false" aria-controls="form-crear-usuario">+ Crear nuevo usuario</button>
    </div>
    <form class="user-form" id="form-crear-usuario" hidden>
      <h3>Crear usuario de demostración</h3>
      <div class="user-fields">
        <label for="user-name">Nombre
          <input id="user-name" type="text" maxlength="100" required>
        </label>
        <label for="user-email">Correo
          <input id="user-email" type="email" required>
        </label>
        <div class="user-actions">
          <button class="button-primario" type="submit">Crear usuario</button>
          <button type="button" id="cancelar-usuario">Cancelar</button>
        </div>
      </div>
    </form>

    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr><th>Usuario</th><th>Correo</th><th>Cultivos</th><th>Sensores</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <template x-for="usuario in $store.datos.usuarios" :key="usuario.id">
          <tr>
            <td x-text="usuario.nombre"></td>
            <td x-text="usuario.correo"></td>
            <td x-text="$store.datos.cultivos.filter((c) => c.usuarioId === usuario.id).length"></td> <!--c de cultivo-->
            <td x-text="$store.datos.sensores.filter((s) => s.usuarioId === usuario.id).length"></td> <!--s de sensor-->
            <!--Ahora se calculan los cultivos y sensores desde los datosd-->
            <td><button type="button" class="button-action edit">Editar</button> <button type="button" class="button-action delete">Eliminar</button></td>
          </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
    const botonMostrarUsuario = document.getElementById('btn-mostrar-usuario');
    const formularioUsuario = document.getElementById('form-crear-usuario');
    const botonCancelarUsuario = document.getElementById('cancelar-usuario');

    function mostrarFormularioUsuario(mostrar) {
      formularioUsuario.hidden = !mostrar;
      botonMostrarUsuario.setAttribute('aria-expanded', String(mostrar));
    }

    botonMostrarUsuario.addEventListener('click', () => {
      mostrarFormularioUsuario(formularioUsuario.hidden);
    });

    botonCancelarUsuario.addEventListener('click', () => {
      formularioUsuario.reset();
      mostrarFormularioUsuario(false);
      botonMostrarUsuario.focus();
    });

    mostrarFormularioUsuario(false);
  </script>
</body>

</html>
