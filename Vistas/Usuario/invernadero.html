<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../CSS/invernadero.css">
  <link rel="stylesheet" href="../../CSS/global.css">
  <title>Mi Invernadero</title>
  <script defer src="../../JS/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<header class="navbar">
  <a href="dashboard.html" class="logo">&#x1FAB4; Gestión Invernaderos</a>
  <nav class="navbar-navigation" aria-label="Navegación principal">
    <input type="checkbox" id="menu-toggle" class="menu-toggle"><label for="menu-toggle" class="menu-toggle-label">☰ Menú</label>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-button">Inicio</a>
      <a href="invernadero.html" class="nav-button active">Invernadero</a>
      <a href="agregar.html" class="nav-button">Agregar</a>
      <a href="estadisticas.html" class="nav-button">Estadísticas</a>
      <a href="../login.html" class="nav-button button-logout">Cerrar Sesión</a>
    </div>
  </nav>
</header>
<main class="main-container" x-data>
  <h1>Mi Invernadero</h1>
    <section class="card" x-data="filtroCultivos()">
    <h2>Cultivos</h2>
    <div class="cultivo-controls">
      <div>
        <label for="filtro-tipo">Filtrar por tipo</label>
        <select id="filtro-tipo" x-model="filtroTipo">
          <option value="">Todos los tipos</option>
          <template x-for="tipo in tipos" :key="tipo">
            <option :value="tipo" x-text="tipo"></option>
          </template>
        </select>
      </div>
      <div>
        <label for="orden-fecha">Ordenar por fecha</label>
        <select id="orden-fecha" x-model="orden">
          <option value="fecha-asc">Más antigua primero</option>
          <option value="fecha-desc">Más reciente primero</option>
        </select>
      </div>
    </div>
    <p class="muted" x-show="cultivosVisibles.length === 0" role="status">
      No hay cultivos para este filtro.
      <button type="button" class="button-secundario" @click="limpiarFiltro()" x-show="filtroTipo !== ''">Quitar filtro</button>
    </p>
    <div class="table-container" x-show="cultivosVisibles.length > 0">
      <table class="tabla-cultivos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Estacional</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="cultivo in cultivosVisibles" :key="cultivo.id">
          <tr>
            <td x-text="cultivo.nombre"></td>
            <td x-text="cultivo.tipo"></td>
            <td x-text="cultivo.fecha"></td>
            <td x-text="$store.datos.textoEstacional(cultivo.estacional)"></td>
          </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>
  <section class="card">
    <h2>Sensores</h2>
    <div class="table-container">
      <table class="tabla-sensores">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Unidad</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="sensor in $store.datos.sensores" :key="sensor.id">
          <tr>
            <td x-text="sensor.nombre"></td>
            <td x-text="sensor.descripcion"></td>
            <td x-text="sensor.unidad"></td>
            <td><span :class="$store.datos.visualEstado(sensor.estado).clase" x-text="$store.datos.visualEstado(sensor.estado).icono + ' ' + sensor.estado"></span></td>
          </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
